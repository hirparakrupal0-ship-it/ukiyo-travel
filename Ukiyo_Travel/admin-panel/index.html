<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center · Ukiyo Travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

    <!-- Guard screen (shown while checking access, or when access is denied) -->
    <div class="admin-guard" id="guard">
        <div class="guard-card">
            <i class="bi bi-shield-lock"></i>
            <p id="guardMsg">Checking access…</p>
            <div class="guard-actions">
                <a href="login.html" class="btn-ghost" id="guardLogin" style="display:none;">Log in</a>
                <a href="#" class="btn-ghost js-site-link" id="guardLink" style="display:none;">Back to site</a>
                <button class="btn-ghost" id="guardRetry" style="display:none;">Try again</button>
            </div>
        </div>
    </div>

    <!-- Admin shell -->
    <div class="admin-shell" id="shell" style="display:none;">

        <div class="side-backdrop" id="sideBackdrop"></div>

        <!-- Sidebar -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="admin-brand">
                <img src="assets/ukiyo-travel-logo.png" alt="Ukiyo Travel">
                <div class="brand-sub">Command Center</div>
            </div>
            <nav class="admin-nav" id="adminNav">
                <div class="nav-group">Overview</div>
                <button class="admin-nav-item" data-view="dashboard"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></button>
                <div class="nav-group">Operations</div>
                <button class="admin-nav-item" data-view="bookings"><i class="bi bi-suitcase-lg"></i><span>Bookings</span></button>
                <button class="admin-nav-item" data-view="payments"><i class="bi bi-credit-card-2-front"></i><span>Payments</span></button>
                <button class="admin-nav-item" data-view="calendar"><i class="bi bi-calendar3"></i><span>Booking Calendar</span></button>
                <div class="nav-group">People</div>
                <button class="admin-nav-item" data-view="users"><i class="bi bi-people"></i><span>Users</span></button>
                <button class="admin-nav-item" data-view="reviews"><i class="bi bi-star"></i><span>Reviews</span></button>
                <button class="admin-nav-item" data-view="enquiries"><i class="bi bi-envelope"></i><span>Enquiries</span><b class="nav-count" id="navEnqCount" hidden></b></button>
                <div class="nav-group">Catalog</div>
                <button class="admin-nav-item" data-view="destinations"><i class="bi bi-geo-alt"></i><span>Destinations</span></button>
                <button class="admin-nav-item" data-view="hotels"><i class="bi bi-building"></i><span>Hotels</span></button>
                <button class="admin-nav-item" data-view="packages"><i class="bi bi-box-seam"></i><span>Packages</span></button>
                <button class="admin-nav-item" data-view="featured"><i class="bi bi-stars"></i><span>Featured Content</span></button>
                <div class="nav-group">System</div>
                <button class="admin-nav-item" data-view="settings"><i class="bi bi-gear"></i><span>Settings</span></button>
            </nav>
            <div class="admin-side-foot">
                <a href="#" class="side-link js-site-link" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> <span>View website</span></a>
            </div>
        </aside>

        <!-- Main -->
        <main class="admin-main">
            <header class="admin-topbar">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><i class="bi bi-list"></i></button>
                <div class="topbar-title">
                    <h1 id="viewTitle">Dashboard</h1>
                    <p id="viewSub">Overview of your Ukiyo Travel platform</p>
                </div>
                <div class="admin-user">
                    <span class="today-chip" id="todayChip" title="Server date"><i class="bi bi-calendar-check"></i> <span id="todayText">—</span></span>
                    <div class="bell-wrap">
                        <button class="icon-btn bell-btn" id="bellBtn" aria-label="Alerts"><i class="bi bi-bell"></i><b class="bell-badge" id="bellBadge" hidden>0</b></button>
                        <div class="bell-panel" id="bellPanel" hidden></div>
                    </div>
                    <div class="admin-chip"><span class="avatar" id="adminAvatar">A</span><span id="adminName">Admin</span></div>
                    <button class="btn-ghost" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> <span class="hide-sm">Logout</span></button>
                </div>
            </header>

            <div class="admin-content">
                <section class="view" id="view-dashboard" hidden></section>
                <section class="view" id="view-bookings" hidden></section>
                <section class="view" id="view-payments" hidden></section>
                <section class="view" id="view-calendar" hidden></section>
                <section class="view" id="view-users" hidden></section>
                <section class="view" id="view-reviews" hidden></section>
                <section class="view" id="view-enquiries" hidden></section>
                <section class="view" id="view-destinations" hidden></section>
                <section class="view" id="view-hotels" hidden></section>
                <section class="view" id="view-packages" hidden></section>
                
                <section class="view" id="view-featured" hidden></section>
                <section class="view" id="view-settings" hidden></section>
            </div>
        </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toast-root" id="toastRoot" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="js/auth-api.js"></script>
    <script>(function(){var u=(window.UKIYO_CONFIG||{}).userUrl||"http://localhost:3000";document.querySelectorAll(".js-site-link").forEach(function(a){a.href=u;});})();</script>
    <script src="js/admin-core.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-ops.js"></script>
    <script src="js/admin-people.js"></script>
    <script src="js/admin-catalog.js"></script>
    <script src="js/admin-settings.js"></script>
</body>
</html>
